const ph=(src,label,st="")=>`<div class="ph" style="${st}"><span>Add photo<br>${E(src||label)}</span>${src?`<img src="${E(src)}" alt="${E(label)}" onerror="this.remove()">`:""}</div>`;
const tags=a=>a.map(x=>`<span class="tag">${E(x)}</span>`).join("");
const D=DATA;
/* ---------- sections (one per tower) ---------- */
const S=[
{x:1500,n:"ABOUT",h:()=>`<h2>The Mind</h2><div style="display:grid;grid-template-columns:1fr 130px;gap:14px"><div><p>${E(D.bio)}</p><div style="margin-top:8px">${tags(D.interests)}</div></div>${ph(D.profile,"Portrait of Liya Elizabeth Roji","aspect-ratio:3/4")}</div><p style="margin-top:10px">${E(D.edu)}</p>`},
{x:2200,n:"PROJECTS",h:()=>`<h2>The Creations</h2><p>Select a project for its case study.</p>${D.projects.map((p,i)=>`<button class="pj" data-case="${i}"><b>${E(p.t)}</b><br>${E(p.s)}<br>${tags(p.tech)}</button>`).join("")}`},
{x:2900,n:"ACHIEVEMENTS",win:1,h:()=>`<h2>Hall of Recognition</h2><p>Winner at KSUM She Builds Tech 3.0 and Tink-Her Hack 3.0. Finalist at SAP. Round 2 at UST SIGHT 3.0.</p><div class="gal"></div>`},
{x:3600,n:"EXPERTISE",h:()=>`<h2>The Arsenal</h2>${Object.entries(D.skills).map(([k,v])=>`<h3>${E(k)}</h3>${tags(v)}`).join("")}`},
{x:4300,n:"JOURNEY",h:()=>`<h2>The Timeline</h2>${D.time.map(t=>`<h3>${E(t[1])}<em>${E(t[0])}</em></h3><p>${E(t[2])}</p>`).join("")}`},
{x:5000,n:"CONTACT",h:()=>`<h2>The Connection</h2><p><a href="mailto:${D.email}">${D.email}</a><br><a href="${D.linkedin}" target="_blank" rel="noopener">LinkedIn</a> · <a href="${D.github}" target="_blank" rel="noopener">GitHub</a></p><a class="b" href="${D.resume}" download="Liya_Elizabeth_Roji_Resume.pdf">Download resume</a>`}];
/* ---------- gallery + lightbox ---------- */
let cat="all",shown=[],li=0,last;
const metaText=a=>[a.e,a.d,a.p].filter(Boolean).join(" · ");
function gal(){document.querySelectorAll(".gal").forEach(g=>{
 const used=["all",...new Set(D.ach.map(a=>a.c))];shown=D.ach.filter(a=>cat=="all"||a.c==cat);
 g.innerHTML=`<div role="group" aria-label="Filter">${used.map(k=>`<button class="b${k==cat?" on":""}" data-cat="${k}" aria-pressed="${k==cat}">${E(D.cats[k]||k)}</button>`).join("")}</div><div class="mas">${shown.map((a,i)=>{
  const meta=metaText(a); const caption = meta ? `${meta}${a.x?`<br>${E(a.x)}`:""}` : (a.x?E(a.x):"");
  return `<button class="tile" data-lb="${i}" aria-label="Open ${E(a.t)}">${ph(a.img,a.t,`height:${a.h||180}px`)}<span class="cap"><b>${E(a.t)}</b>${caption?`<br>${caption}`:""}</span></button>`;
 }).join("")}</div>`})}
function lb(i){li=(i+shown.length)%shown.length;const a=shown[li];last=document.activeElement;
 $("li").outerHTML=ph(a.img,a.t).replace('class="ph"','class="ph" id="li"');$("lt").textContent=a.t;$("lm").textContent=[metaText(a),a.x].filter(Boolean).join(". ");$("lb").classList.add("on");$("lx").focus()}
function closeAll(){["lb","md"].forEach(i=>$(i).classList.remove("on"));$("menu").classList.remove("open");last&&last.focus&&last.focus();last=0}
const open=()=>$("lb").classList.contains("on")||$("md").classList.contains("on")||$("menu").classList.contains("open");
function cs(i){const p=D.projects[i];last=document.activeElement;
 const sec=(h,b)=>b?`<h3>${h}</h3>${b}`:"",ul=a=>a&&a.length?`<ul>${a.map(r=>`<li>${E(r)}</li>`).join("")}</ul>`:"",pr=x=>x?`<p>${E(x)}</p>`:"";
 $("mb").innerHTML=`<article class="cs"><h2>${E(p.t)}</h2><p class="lead">${E(p.s)}</p>${sec("Overview",pr(p.d))}${sec("The problem",pr(p.problem))}${sec("What I built",pr(p.built))}${sec("Key features",ul(p.features))}${sec("My contribution",ul(p.r))}${sec("Outcome",pr(p.outcome))}<div style="margin:16px 0 6px">${tags(p.tech)}</div>${p.gh?`<a class="b" href="${E(p.gh)}" target="_blank" rel="noopener">GitHub</a>`:""}</article>`;
 $("md").classList.add("on");$("mx").focus()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-cat],[data-lb],[data-case]");if(!t)return;
 if(t.dataset.cat){cat=t.dataset.cat;gal()}else if(t.dataset.lb!==undefined)lb(+t.dataset.lb);else cs(+t.dataset.case)});
$("lp").onclick=()=>lb(li-1);$("ln").onclick=()=>lb(li+1);$("lx").onclick=$("mx").onclick=closeAll;
/* ---------- recruiter (flat) view ---------- */
$("flat").innerHTML=S.map(s=>`<section aria-label="${s.n}">${s.h()}</section>`).join("");
$("fv").onclick=()=>{const on=document.body.classList.toggle("flat");$("fv").textContent=on?"Walk the world":"Recruiter view";$("fv").setAttribute("aria-pressed",on);gal()};
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;if(RM)$("fv").click();
/* ---------- world ---------- */
$("pl").insertAdjacentHTML("beforeend",'<div class="ghost" aria-hidden="true">'+$("pl").querySelector(".solid").innerHTML+"</div>");
const tr=[],W=5400,pl=$("pl"),cam=$("cam"),panel=$("panel"),menu=$("menu"),mp=$("map");
let px=300,vy=0,y=0,face=1,tgt=null,act=-1,cx=0,k={},t=0;
S.forEach((s,i)=>{$("sts").insertAdjacentHTML("beforeend",`<button class="st" id="s${i}" style="left:${s.x}px" aria-label="Go to ${s.n}"><span>${s.n}</span><div class="tw"></div></button>`);
 $("s"+i).onclick=()=>tgt=s.x;menu.insertAdjacentHTML("beforeend",`<button data-w="${i}">${s.n}</button>`);mp.insertAdjacentHTML("afterbegin",`<u style="left:${s.x/W*100}%"></u>`)});
menu.onclick=e=>{const i=e.target.dataset.w;if(i!==undefined){document.body.classList.remove("flat");$("fv").textContent="Recruiter view";tgt=S[i].x;menu.classList.remove("open")}};
$("burger").onclick=()=>{const o=menu.classList.toggle("open");$("burger").setAttribute("aria-expanded",o)};
const typing=e=>/INPUT|TEXTAREA/.test(e.target.tagName);
onkeydown=e=>{const c=e.key.toLowerCase();if(c=="escape")return closeAll();if(open()){if($("lb").classList.contains("on")){if(c=="arrowright")lb(li+1);if(c=="arrowleft")lb(li-1)}return}
 if(typing(e)||document.body.classList.contains("flat"))return;k[c]=1;if(c==" "||c=="w"||c=="arrowup"){jump();e.preventDefault()}if(c=="c")confetti();tgt=null};
onkeyup=e=>k[e.key.toLowerCase()]=0;
[["bl","a"],["br","d"],["bj","w"]].forEach(([id,key])=>{const b=$(id);b.onpointerdown=()=>{k[key]=1;tgt=null;if(key=="w")jump()};["pointerup","pointerleave","pointercancel"].forEach(v=>b.addEventListener(v,()=>k[key]=0))});
function jump(){if(y<=0)vy=15}
function confetti(n=70){const c=["#C8D44E","#00FF99","#F5F5F0","#1A3D3A"];for(let i=0;i<n;i++){const d=document.createElement("i");d.className="cp";d.style.cssText=`left:${Math.random()*100}%;background:${c[i%4]};--x:${(Math.random()-.5)*200}px;--r:${Math.random()*900}deg;animation-duration:${2+Math.random()*2}s`;document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}}
const cv=$("stars"),g=cv.getContext("2d");let st=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight;st=Array.from({length:150},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.8+.3,z:Math.random()*.25+.03,p:Math.random()*6}))}rs();onresize=rs;
function loop(){t++;
 if(!document.body.classList.contains("flat")&&!open()){
 const l=k.a||k.arrowleft,r=k.d||k.arrowright;let vx=l?-6:r?6:0;
 if(tgt!==null&&!vx){const d=tgt-px;if(Math.abs(d)<8)tgt=null;else vx=Math.sign(d)*9}
 if(vx){face=vx>0?1:-1;px=Math.max(80,Math.min(W-80,px+vx))}
 if(y>0||vy>0){y+=vy;vy-=.7;if(y<=0){y=0;vy=0}}
 pl.style.left=px+"px";pl.style.transform=`translateY(${-y}px) scaleX(${face})`;pl.classList.toggle("walk",!!vx&&y==0);pl.classList.toggle("idle",!vx&&y==0);
 if(vx||y>0)tr.push({x:px+face*38,y:innerHeight*.78-52-y,a:1});
 cx+=(Math.max(0,Math.min(W-innerWidth,px-innerWidth*.4))-cx)*.1;cam.style.transform=`translateX(${-cx}px)`;
 let n=-1;S.forEach((s,i)=>{if(Math.abs(s.x-px)<110)n=i;$("s"+i).classList.toggle("on",i==n)});
 if(n!=act){act=n;if(n>=0){panel.innerHTML=S[n].h();panel.scrollTop=0;panel.classList.add("show");gal();if(S[n].win)confetti(60)}else panel.classList.remove("show")}
 $("me").style.left=px/W*100+"%";pl.classList.toggle("near",n>=0);$("box").classList.toggle("open",n==5)}
 g.clearRect(0,0,cv.width,cv.height);g.fillStyle="#F5F5F0";
 st.forEach(s=>{g.globalAlpha=RM?.6:.4+.6*Math.abs(Math.sin(t*.03+s.p));g.fillRect((((s.x-cx*s.z)%cv.width)+cv.width)%cv.width,s.y,s.r,s.r)});
 tr.forEach((q,i)=>{q.a-=.02;g.globalAlpha=Math.max(q.a,0)*.8;g.fillStyle=i%2?"#00FF99":"#C8D44E";g.fillRect(q.x-cx,q.y+Math.sin(i)*3,3,3)});while(tr.length&&tr[0].a<=0)tr.shift();
 requestAnimationFrame(loop)}
loop();gal();
</script>
</body>
</html>
