<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liya Elizabeth Roji — The Digital Archive</title>
<meta name="description" content="Enter the digital archive of Liya Elizabeth Roji: CSE student, developer and hackathon winner.">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Syne:wght@700&display=swap" rel="stylesheet">
<style>
/* Glow colour: mint to match the portfolio. For your reference's red, set --glow:#ff1a1a */
:root{--bg:#050807;--glow:#00FF99;--a:#C8D44E;--tx:#F5F5F0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:12px "IBM Plex Mono",monospace;cursor:default}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
:focus-visible{outline:1px solid var(--glow);outline-offset:8px}
#face{width:clamp(90px,14vw,130px);height:auto;overflow:visible;cursor:pointer;
 filter:drop-shadow(0 0 5px var(--glow)) drop-shadow(0 0 16px var(--glow));animation:wake 1.6s ease both;transition:transform 1s cubic-bezier(.7,0,.9,.4)}
@keyframes wake{from{opacity:0}to{opacity:1}}
#head,#eyes,#mouth{transition:transform .14s ease-out}
.eye{fill:#fff;transform-box:fill-box;transform-origin:center}
#eyes{animation:blink 5s 2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
#mouth{fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nm{letter-spacing:.3em;color:#f5f5f0aa;opacity:0;animation:show 1s 2s forwards}
.go-btn{background:none;border:0;color:var(--glow);font:inherit;letter-spacing:.3em;cursor:pointer;padding:8px 14px;opacity:0;animation:show 1s 2.6s forwards,pulse 2.4s 3.6s infinite}
.go-btn:hover{color:#fff;text-shadow:0 0 12px var(--glow)}
@keyframes show{to{opacity:1}}@keyframes pulse{50%{opacity:.35}}
body.go #face{transform:scale(55)}body.go .nm,body.go .go-btn{opacity:0;animation:none;transition:.3s}
body.go #face{opacity:0;transition:transform 1s cubic-bezier(.7,0,.9,.4),opacity .9s .1s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.nm,.go-btn{opacity:1}}
</style>
</head>
<body>
<svg id="face" viewBox="0 0 100 60" role="img" aria-label="A small glowing cat face that follows your cursor. Select to enter the portfolio.">
 <g id="head">
  <g id="eyes"><circle class="eye" cx="34" cy="26" r="7.5"/><circle class="eye" cx="66" cy="26" r="7.5"/></g>
  <path id="mouth" d="M43 40L47 45L50 40L53 45L57 40"/>
 </g>
</svg>
<p class="nm">LIYA ELIZABETH ROJI</p>
<button class="go-btn" id="go">ENTER</button>
<script>
const NEXT="portfolio.html"; /* the walkable portfolio */
const $=id=>document.getElementById(id),RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
let busy=false,moved=0;
/* look in every direction: head, eyes and mouth shift by different amounts for depth */
/* the blink animation owns #eyes, so offset each eye individually */
function lookEyes(x,y){document.querySelectorAll(".eye").forEach(e=>e.style.transform=`translate(${x*4.5}px,${y*3.5}px)`)}
function aim(x,y){$("head").style.transform=`translate(${x*8}px,${y*5}px)`;$("mouth").style.transform=`translate(${x*3}px,${y*2}px)`;lookEyes(x,y)}
if(!RM){
 const move=(cx,cy)=>{if(busy)return;moved=Date.now();const r=$("face").getBoundingClientRect(),dx=cx-(r.left+r.width/2),dy=cy-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,k=Math.min(1,d/260);aim(dx/d*k,dy/d*k)};
 addEventListener("pointermove",e=>move(e.clientX,e.clientY));
 /* no cursor (touch)? wander and glance around */
 setInterval(()=>{if(!busy&&Date.now()-moved>2500){const a=Math.random()*6.28,k=.4+Math.random()*.6;aim(Math.cos(a)*k,Math.sin(a)*k)}},1400)}
function enter(){if(busy)return;busy=true;aim(0,0);document.body.classList.add("go");setTimeout(()=>location.href=NEXT,RM?0:1000)}
$("go").onclick=$("face").onclick=enter;
addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();enter()}});
addEventListener("pageshow",e=>{if(e.persisted){busy=false;document.body.classList.remove("go")}});
</script>
</body>
</html>
